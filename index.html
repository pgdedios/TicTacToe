<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>TicTacToe</title>
		<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230b0f19'/><path d='M25 25 L55 55 M55 25 L25 55' stroke='%2300f2fe' stroke-width='10' stroke-linecap='round'/><circle cx='70' cy='70' r='15' fill='none' stroke='%23fe0979' stroke-width='8'/></svg>">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
		<!-- Theme Toggle -->
		<button id="themeToggle" title="Toggle Theme">
			<span class="sun">☀️</span>
			<span class="moon">🌙</span>
		</button>
		
		<!-- Start Screen Overlay -->
		<div id="startPage">
			<h1>TIC TAC TOE</h1>
			<p>Choose who starts first</p>
			<div class="start-buttons">
				<button id="xButton">X</button>
				<button id="oButton">O</button>
			</div>
		</div>
		
		<!-- Main Game Container -->
		<div class="game-container">
			<h1 id="title">TIC TAC TOE</h1>

			<!-- Scoreboard & Turn Indicator -->
			<div id="subContainer">
				<div class="score-box x-score">
					<span class="score-label">Player X</span>
					<span class="score" id="xScore">0</span>
				</div>
					<div id="playerTurn">X is playing</div>
				<div class="score-box o-score">
					<span class="score-label">Player O</span>
					<span class="score" id="oScore">0</span>
				</div>
			</div>

			<!-- Game Board -->
			<div id="board"></div>

			<!-- Replay Controls -->
			<div id="buttons" class="hide">
				<button id="prev">PREVIOUS</button>
				<button id="reset">RESET</button>
				<button id="next">NEXT</button></br>
			</div>

			<!-- Game Over Messages -->
			<div id="winner1" class="hide message x-win">X Wins!</div>
			<div id="winner2" class="hide message o-win">O Wins!</div>
			<div id="gameDraw" class="hide message draw">GAME OVER: TIE</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
